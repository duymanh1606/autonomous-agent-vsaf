# Public-facing reverse proxy for a server deployment - installed as the
# HOST's own nginx (via apt/yum, NOT inside Docker), sitting in front of the
# dashboard's own container (dashboard/nginx.conf.template) which already
# listens on 127.0.0.1:${DASHBOARD_PORT:-25173} (see compose.yaml/deploy.sh).
# That inner nginx already proxies /api/* (including the /api/events
# WebSocket) to the supervisor - this outer layer only needs to add real
# HTTPS and forward everything else through unchanged.
#
# This file is a static nginx conf, not a template - if DASHBOARD_PORT is
# overridden away from its default in .env, update proxy_pass below to match
# (there is no envsubst step for this one, unlike dashboard/nginx.conf.template).
#
# Install (see deploy/README.md for the full walkthrough):
#   sudo cp deploy/nginx-reverse-proxy.conf /etc/nginx/sites-available/autonomous-agent
#   # edit server_name below to your real domain first
#   sudo ln -s /etc/nginx/sites-available/autonomous-agent /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d your-domain.example
#
# certbot --nginx rewrites the `listen 443`/`ssl_certificate` lines itself
# the first time it runs - the block below is deliberately a plain HTTP
# server so certbot has something valid to attach the certificate to.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;  # <-- replace with your real domain

    # Never expose Postgres/the supervisor's own port directly - only this
    # proxy (and, on the host itself, the RDP/VNC session for Chrome
    # login/CAPTCHA) should be reachable from outside.
    location / {
        proxy_pass http://127.0.0.1:25173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/events is a WebSocket; the map above leaves ordinary
        # requests' Connection header alone (avoids breaking keep-alive).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
